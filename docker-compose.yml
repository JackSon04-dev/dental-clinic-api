services:
  postgres:
    image: postgres:16
    container_name: dentaldb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:?Vui lòng cấu hình DB_USER trong .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Vui lòng cấu hình DB_PASSWORD trong .env}
      POSTGRES_DB: ${DB_NAME:?Vui lòng cấu hình DB_NAME trong .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-DentalClinicDB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dental_clinic_api
    restart: unless-stopped
    command: sh -c "npx prisma db push && npm run dev"
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
      - "5555:5555"
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Vui lòng cấu hình JWT_SECRET trong .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Vui lòng cấu hình JWT_REFRESH_SECRET trong .env}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  dental_pgdata:
