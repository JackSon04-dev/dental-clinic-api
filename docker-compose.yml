services:
  postgres:
    image: postgres:16
    container_name: dentaldb
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: DentalClinicDB
    ports:
      - "5432:5432"
    volumes:
      - dental_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DentalClinicDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: dental_clinic_api
    restart: unless-stopped
    command: sh -c "npx prisma db push && npm run dev"
    ports:
      - "5000:5000"
      - "5555:5555"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://admin:password123@postgres:5432/DentalClinicDB?schema=public
      JWT_SECRET: dental_clinic_jwt_super_secret_key_2026
      JWT_REFRESH_SECRET: dental_clinic_jwt_refresh_super_secret_key_2026
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  dental_pgdata:
